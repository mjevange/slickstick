    <tspan x="22.0" y="52.0" fill="#0078ff" font-weight="700">  ____  _ _      _     ____  _   _      _</tspan><tspan x="22.0" y="72.0" fill="#00aaff" font-weight="700"> / ___|| (_) ___| | __/ ___|| |_(_) ___| | __</tspan><tspan x="22.0" y="92.0" fill="#00d2ff" font-weight="700"> \___ \| | |/ __| |/ /\___ \| __| |/ __| |/ /</tspan><tspan x="22.0" y="112.0" fill="#5aebff" font-weight="700">  ___) | | | (__|   &lt;  ___) | |_| | (__|   &lt;</tspan><tspan x="22.0" y="132.0" fill="#aaf8ff" font-weight="700"> |____/|_|_|\___|_|\_\|____/ \__|_|\___|_|\_\</tspan><tspan x="22.0" y="152.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="152.0" fill="#abb2bf" font-weight="700">Build bootable macOS installer USBs</tspan><tspan x="332.8" y="152.0" fill="#abb2bf" font-weight="400"> </tspan><tspan x="341.2" y="152.0" fill="#636d83" font-weight="400">— without a Mac</tspan><tspan x="22.0" y="172.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="172.0" fill="#636d83" font-weight="400">github.com/mjevange/slickstick</tspan><tspan x="22.0" y="212.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="212.0" fill="#98c379" font-weight="400">✓</tspan><tspan x="47.2" y="212.0" fill="#abb2bf" font-weight="400"> Dependencies OK.</tspan><tspan x="22.0" y="272.0" fill="#abb2bf" font-weight="400">Target Mac architecture?</tspan><tspan x="22.0" y="292.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="292.0" fill="#56b6c2" font-weight="700">1</tspan><tspan x="47.2" y="292.0" fill="#abb2bf" font-weight="400">) Apple Silicon (M1/M2/M3/… — proven)</tspan><tspan x="22.0" y="312.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="312.0" fill="#56b6c2" font-weight="700">2</tspan><tspan x="47.2" y="312.0" fill="#abb2bf" font-weight="400">) Intel (recovery stick proven; or clone a full installer)</tspan><tspan x="22.0" y="332.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="332.0" fill="#56b6c2" font-weight="700">3</tspan><tspan x="47.2" y="332.0" fill="#abb2bf" font-weight="400">) ↺  Start over</tspan><tspan x="22.0" y="352.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="352.0" fill="#56b6c2" font-weight="700">4</tspan><tspan x="47.2" y="352.0" fill="#abb2bf" font-weight="400">) ✕  Cancel</tspan><tspan x="22.0" y="372.0" fill="#abb2bf" font-weight="400">Choose [1-4]: 1</tspan><tspan x="22.0" y="412.0" fill="#abb2bf" font-weight="400">How should SlickStick get macOS?</tspan><tspan x="22.0" y="432.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="432.0" fill="#56b6c2" font-weight="700">1</tspan><tspan x="47.2" y="432.0" fill="#abb2bf" font-weight="400">) Download from Apple via gibMacOS (recommended)</tspan><tspan x="22.0" y="452.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="452.0" fill="#56b6c2" font-weight="700">2</tspan><tspan x="47.2" y="452.0" fill="#abb2bf" font-weight="400">) Clone from an inserted macOS installer stick (real markers, proven)</tspan><tspan x="22.0" y="472.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="472.0" fill="#56b6c2" font-weight="700">3</tspan><tspan x="47.2" y="472.0" fill="#abb2bf" font-weight="400">) Use files I already have (an Install app or a .pkg)</tspan><tspan x="22.0" y="492.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="492.0" fill="#56b6c2" font-weight="700">4</tspan><tspan x="47.2" y="492.0" fill="#abb2bf" font-weight="400">) Download a direct InstallAssistant.pkg URL</tspan><tspan x="22.0" y="512.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="512.0" fill="#56b6c2" font-weight="700">5</tspan><tspan x="47.2" y="512.0" fill="#abb2bf" font-weight="400">) ↺  Start over</tspan><tspan x="22.0" y="532.0" fill="#abb2bf" font-weight="400">  </tspan><tspan x="38.8" y="532.0" fill="#56b6c2" font-weight="700">6</tspan><tspan x="47.2" y="532.0" fill="#abb2bf" font-weight="400">) ✕  Cancel</tspan>
