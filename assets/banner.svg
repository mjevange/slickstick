<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="slickstick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fb567"/>
      <stop offset="0.5" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7db7ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- subtle circuit traces -->
  <g stroke="#2b3a66" stroke-width="2" fill="none" opacity="0.6">
    <path d="M40 60 H180 V110 H120"/>
    <path d="M40 160 H120 V220 H240"/>
    <path d="M40 260 H200"/>
    <circle cx="120" cy="110" r="4" fill="#2b3a66" stroke="none"/>
    <circle cx="240" cy="220" r="4" fill="#2b3a66" stroke="none"/>
  </g>

  <!-- chip + usb glyph -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="100" height="100" rx="14" fill="#101832" stroke="url(#accent)" stroke-width="3"/>
    <rect x="26" y="26" width="48" height="48" rx="6" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <g stroke="url(#accent)" stroke-width="3">
      <line x1="20" y1="-10" x2="20" y2="0"/><line x1="50" y1="-10" x2="50" y2="0"/><line x1="80" y1="-10" x2="80" y2="0"/>
      <line x1="20" y1="100" x2="20" y2="110"/><line x1="50" y1="100" x2="50" y2="110"/><line x1="80" y1="100" x2="80" y2="110"/>
      <line x1="-10" y1="20" x2="0" y2="20"/><line x1="-10" y1="50" x2="0" y2="50"/><line x1="-10" y1="80" x2="0" y2="80"/>
      <line x1="100" y1="20" x2="110" y2="20"/><line x1="100" y1="50" x2="110" y2="50"/><line x1="100" y1="80" x2="110" y2="80"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="250" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#f2f4f8">slick<tspan fill="url(#accent)">stick</tspan></text>
  <text x="252" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="600" fill="#e7ecf5">Build bootable macOS installer USBs &#8212; without a Mac</text>
  <text x="252" y="238" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" fill="#6f7b99">no Mac required to build &#183; downloads straight from Apple &#183; GPT + HFS+ + content</text>

  <rect x="252" y="258" width="300" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>
</svg>
